<!DOCTYPE html>
<html>
<head>

<title>3 Question Form</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
background:#f2f2f2;
}

.form-box{
margin-top:80px;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0px 0px 10px gray;
}
</style>

</head>

<body>

<div class="container">
<div class="row justify-content-center">
<div class="col-md-6">

<div class="form-box">

<h3 class="text-center mb-4">Quick Survey</h3>

{% if message %}
<div class="alert alert-success">
{{message}}
</div>
{% endif %}

<form method="POST">

{% csrf_token %}

<div class="mb-3">
<label class="form-label">1. What is your name?</label>
<input type="text" name="q1" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">2. What is your favorite programming language?</label>
<input type="text" name="q2" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">3. Why do you want to learn web development?</label>
<textarea name="q3" class="form-control" required></textarea>
</div>

<button type="submit" class="btn btn-primary w-100">Submit</button>

</form>

</div>

</div>
</div>
</div>

<script>
document.querySelector("form").addEventListener("submit",function(){
alert("Form Submitted Successfully!");
});
</script>

</body>
</html>
